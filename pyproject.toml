[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-wallet-multirail"
version = "0.1.0"
description = "A runnable multi-rail agent-payment adapter: one PaymentRail interface, Nano (XNO) and EVM/USDC rails, with a tested example for agent-wallet SDKs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PANDeveloper001" }]
keywords = ["nano", "xno", "x402", "agent-wallet", "payments", "ai-agents"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
